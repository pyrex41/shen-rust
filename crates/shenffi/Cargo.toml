[package]
name = "shenffi"
version.workspace = true
edition.workspace = true

# A thin C-ABI surface over shen-rust, so the interpreter can be embedded in
# non-Rust hosts (Swift / iOS, etc.) as a static library or framework.
#   - staticlib -> libshenffi.a   (link into an Xcode app / .xcframework)
#   - cdylib    -> libshenffi.dylib (handy for desktop linking / testing)
[lib]
name = "shenffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Full engine: embedded kernel boot calls `aot::kernel::install_all` and
# `eval`. Named explicitly so a lean `--no-default-features` build of the
# engine does not silently drop them here.
shen-rust = { path = "../shen-rust", features = ["cedar", "kernel-aot", "interpreter"] }
