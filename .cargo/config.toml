# Booting the kernel (and type-checked loads such as the conformance suite or
# kernel/stlib/install.shen) recurses well past the 2 MB default stack of
# cargo's test threads. The `shen-rust` binary already
# boots on a >=64 MB thread (bin/shen-rust/src/main.rs); this sets the same
# floor for every thread cargo spawns (tests, doctests) so `cargo test` and a
# bare `cargo run` behave without a hand-set RUST_MIN_STACK.
[env]
RUST_MIN_STACK = "268435456"
